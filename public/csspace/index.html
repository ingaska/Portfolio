<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="CS Space - CS2 skin marketplace prototype">
<title>CS Space Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#1C1A24; --panel:#282633; --surface:#312F3D; --surface-hover:#3B3949; --elevated:#403D4D;
  --o8:rgba(204,210,255,.08); --o16:rgba(204,210,255,.16); --border:rgba(255,255,255,.08);
  --t1:#fff; --t2:#BBB9C7; --t3:#817E8F; --placeholder:rgba(204,210,255,.32);
  --purple:#806CF5; --teal:#2EC9B7; --green:#5BC27A; --green-bg:rgba(49,82,63,.6);
  --blue:#0E7DDB; --magenta:#C85CD1; --danger:#FF8095; --orange:#F2892F;
  --r-consumer:#A9AFB8; --r-industrial:#5E98D9; --r-milspec:#4B69FF; --r-restricted:#8847FF;
  --r-classified:#D32CE6; --r-covert:#EB4B4B; --r-extraordinary:#F2C94C;
  --w-fn:#008000; --w-mw:#18A518; --w-ft:#9ACD32; --w-ww:#CD5C5C; --w-bs:#F92424;
  --radius:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--t1);
  font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;line-height:1.4;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- app shell ---------- */
.app{max-width:1440px;margin:0 auto;min-height:100vh}

/* ---------- desktop header ---------- */
.hdr{height:64px;display:flex;align-items:center;gap:28px;padding:0 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60;background:var(--page)}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo-mark{width:32px;height:32px;border:2px solid var(--purple);border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:9px;letter-spacing:.5px;line-height:1.05;text-align:center}
.logo-word{font-weight:800;font-size:17px;letter-spacing:-.4px}
.nav{display:flex;align-items:center;gap:4px}
.nav a{position:relative;padding:0 12px;height:64px;display:flex;align-items:center;color:var(--t2);font-weight:500;font-size:14px;text-decoration:none}
.nav a.on{color:var(--t1)}
.nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--purple);border-radius:2px 2px 0 0}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sel{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:4px;color:var(--t2);font-weight:500;font-size:14px}
.iconbtn{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
.iconbtn:hover{background:var(--o8);color:var(--t1)}
.profile{display:flex;align-items:center;gap:8px;height:40px;padding:4px 8px 4px 4px;border-radius:6px;background:var(--o8)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--magenta);display:grid;place-items:center;font-weight:600;font-size:14px;position:relative}
.avatar::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--page)}

/* ---------- layout ---------- */
.wrap{display:flex;gap:12px;padding:12px 24px 24px}
.sidebar{width:208px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}

/* ---------- toolbar panel ---------- */
.toolbar-panel{margin:12px 24px 0;background:var(--panel);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;overflow:hidden;position:relative;height:32px}
.chip{display:flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:8px;color:var(--t2);font-weight:500;font-size:13px;white-space:nowrap;flex:none}
.chip:hover{background:var(--o8);color:var(--t1)}
.chip.on{background:var(--purple);color:#fff}
.chip .ic{width:15px;height:15px}
.toolbar{display:flex;align-items:center;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:6px;background:var(--elevated)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.search input::placeholder{color:var(--placeholder)}
.kbd{width:22px;height:22px;border-radius:4px;background:var(--o16);display:grid;place-items:center;color:var(--t2);font-size:12px}
.sort{display:flex;align-items:center;gap:6px;height:40px;padding:0 8px;border-radius:6px;color:var(--t2);font-weight:500;font-size:14px;position:relative}
.sort:hover{background:var(--o8)}
.sort select{appearance:none;background:none;border:0;outline:none;color:inherit;font:inherit;cursor:pointer;padding-right:2px}
.sort select option{background:var(--surface);color:var(--t1)}
.tbtn{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
.tbtn:hover{background:var(--o8);color:var(--t1)}
.tbtn.on{background:var(--o16);color:var(--t1)}
.balance{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 10px;border-radius:6px;background:var(--elevated);font-weight:600;font-size:13px}
.balance .topup{width:32px;height:32px;border-radius:4px;background:var(--teal);color:#141018;display:grid;place-items:center}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:6px;background:var(--elevated);color:var(--t2);font-weight:600;font-size:14px}
.cartbtn.has{background:var(--teal);color:#141018}
.cart-count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--magenta);color:#fff;font-size:11px;font-weight:600;display:none;place-items:center;border:2px solid var(--page)}
.cartbtn.has .cart-count{display:grid}

/* ---------- filters ---------- */
.filters{background:transparent;border-radius:var(--radius);overflow:hidden}
.fsec{border-bottom:1px solid var(--border)}
.fsec:last-of-type{border-bottom:0}
.fhead{width:100%;display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 16px;font-weight:600;font-size:13px}
.fhead .ic{width:14px;height:14px;color:var(--t2)}
.fbody{padding:0 16px 14px;display:none;flex-direction:column;gap:10px}
.fsec.open .fbody{display:flex}
.range{position:relative;height:16px}
.range .track{position:absolute;left:0;right:0;top:5px;height:6px;border-radius:3px;background:var(--purple)}
.range .track.wear{background:linear-gradient(90deg,var(--w-fn) 0 7%,var(--w-mw) 7% 15%,var(--w-ft) 15% 38%,var(--w-ww) 38% 45%,var(--w-bs) 45% 100%)}
.range .knob{position:absolute;top:1px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--purple)}
.range .knob.a{left:0}.range .knob.b{right:0}
.fields{display:flex;align-items:center;gap:8px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:4px;background:var(--elevated);font-size:13px}
.field input{width:100%;min-width:0;background:none;border:0;outline:none;font-size:13px}
.field input::placeholder{color:var(--placeholder)}
.dash{width:8px;height:2px;background:var(--elevated);flex:none}
.fchips{display:flex;gap:6px}
.fchip{flex:1;height:26px;border-radius:13px;background:var(--o8);border:1px solid var(--o16);color:var(--t2);font-size:12px;font-weight:500}
.fchip.on{background:var(--teal);border-color:transparent;color:#141018}
.check{display:flex;align-items:center;gap:10px;height:32px;color:var(--t2);font-size:13px;cursor:pointer}
.check .box{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--t3);flex:none;display:grid;place-items:center}
.check.on .box{background:var(--purple);border-color:var(--purple)}
.check.on .box svg{display:block}
.check .box svg{display:none;width:10px;height:10px;stroke:#fff;stroke-width:3}
.check.on{color:var(--t1)}
.swatches{display:flex;flex-wrap:wrap;gap:14px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;position:relative}
.swatch.on{box-shadow:0 0 0 2px var(--page),0 0 0 4px #fff}
.ffoot{display:flex;gap:8px;padding:14px 16px 16px;border-top:1px solid var(--border)}
.ffoot .btn{flex:1;height:32px;border-radius:4px;background:var(--o16);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.ffoot .btn.reset{color:var(--danger)}

/* ---------- grid ---------- */
.gridhead{display:flex;align-items:center;justify-content:space-between;color:var(--t2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.card{min-width:0;background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;position:relative;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;cursor:pointer}
.card:hover{background:var(--surface-hover);transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);z-index:5}
.card .name{font-weight:500;font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .wear{font-weight:500;font-size:11px;line-height:14px;color:var(--t2);padding-bottom:10px}
.shot{position:relative;height:180px;border-radius:6px;background:var(--page);overflow:hidden;display:grid;place-items:center}
.shot .glow{position:absolute;width:83.3%;height:54.5%;border-radius:50%;filter:blur(28px);opacity:.4}
.shot > img{position:relative;max-width:86%;max-height:86%;object-fit:contain}
.views{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:6px;height:20px;padding:0 9px 0 8px;border-radius:12px;background:rgba(30,32,38,.6);border:1px solid var(--o16);font-size:12px;font-weight:500}
.views .ic{width:13px;height:13px;color:var(--purple)}
.stickers{position:absolute;left:8px;bottom:8px;height:22px}
.stickers img{height:22px;width:auto;max-width:none;display:block}
.acts{position:absolute;right:6px;bottom:8px;display:flex;flex-direction:column;gap:6px;opacity:0;transition:opacity .15s}
.card:hover .acts{opacity:1}
.act{width:26px;height:26px;border-radius:50%;background:rgba(30,32,38,.55);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.act:hover{background:rgba(30,32,38,.9)}
.act .ic{width:13px;height:13px}
.fav{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(30,32,38,.6);border:1px solid var(--o16);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .15s}
.card:hover .fav,.fav.on{opacity:1}
.fav.on{color:var(--magenta)}
.fav.on .ic{fill:currentColor}
.prow{display:flex;align-items:center;gap:8px;padding-top:10px}
.price{font-weight:600;font-size:18px;line-height:22px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:500;flex:none}
.badge.disc{background:var(--green-bg);color:var(--green)}
.badge.del{background:#22AA9A;color:#fff;padding-left:5px}
.badge.del .ic{width:11px;height:11px}
.ref{font-size:11px;line-height:14px;color:var(--t3);padding-top:2px}
.ref .rs{display:none}
.frow{display:flex;align-items:center;gap:10px;padding-top:10px}
.wbar{flex:none;width:120px;height:6px;border-radius:3px;position:relative;background:linear-gradient(90deg,var(--w-fn) 0 7%,var(--w-mw) 7% 15%,var(--w-ft) 15% 38%,var(--w-ww) 38% 45%,var(--w-bs) 45% 100%)}
.wbar i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:#fff}
.float{flex:1;text-align:right;font-weight:500;font-size:13px}
.addrow{padding-top:12px}
.add{width:100%;height:32px;border-radius:4px;background:var(--elevated);color:var(--t2);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:13px}
.card:hover .add{background:var(--purple);color:#fff}
.card.incart .add,.card.incart:hover .add{background:var(--green-bg);color:var(--green)}

/* ---------- mini cart ---------- */
.scrim{position:fixed;inset:0;background:rgba(11,10,16,.6);opacity:0;pointer-events:none;transition:opacity .18s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.minicart{position:fixed;width:400px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--o16);border-radius:12px;padding:16px;z-index:80;
  box-shadow:0 24px 64px rgba(0,0,0,.6);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .18s,transform .18s}
.minicart.on{opacity:1;transform:none;pointer-events:auto}
.mc-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;font-weight:600;font-size:14px}
.mc-head .ic{width:16px;height:16px;color:var(--t2)}
.mc-head button{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
.mc-items{max-height:280px;overflow:auto}
.mc-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.mc-thumb{width:72px;height:56px;border-radius:6px;background:var(--page);position:relative;display:grid;place-items:center;overflow:hidden;flex:none}
.mc-thumb .glow{position:absolute;width:72%;height:60%;border-radius:50%;filter:blur(14px);opacity:.45}
.mc-thumb img{position:relative;max-width:88%;max-height:88%}
.mc-info{flex:1;min-width:0}
.mc-info b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-info span{font-size:11px;color:var(--t2)}
.mc-right{text-align:right;font-weight:500;font-size:13px}
.mc-del{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t2);flex:none}
.mc-del:hover{background:var(--o8);color:var(--danger)}
.mc-total{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.mc-total span{color:var(--t2);font-size:14px}
.mc-total b{font-size:18px;font-weight:600}
.bal-row{display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--t2);font-size:14px}
.bal-row .dot{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.bal-row .dot.m{background:var(--magenta)}
.bal-row .dot.i{background:var(--blue)}
.bal-row b{margin-left:auto;font-weight:400}
.split{width:100%;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:600;font-size:15px;margin-top:10px}
.split.buy{background:var(--purple);color:#fff}
.split.top{border:1px solid var(--o16);color:var(--t1)}
.clear{width:100%;height:36px;margin-top:8px;color:var(--danger);font-weight:500;font-size:13px}
.empty{padding:28px 0;text-align:center;color:var(--t3)}

/* ---------- product details ---------- */
.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:1040px;max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);overflow:auto;
  background:var(--page);border-radius:16px;padding:24px;display:flex;gap:24px;box-shadow:0 24px 64px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.m-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.m-shot{flex:1;min-height:360px;border-radius:8px;position:relative;display:grid;place-items:center;overflow:hidden}
.m-shot .glow{position:absolute;width:62%;height:52%;border-radius:50%;filter:blur(50px);opacity:.5}
.m-shot img{position:relative;max-width:78%;max-height:78%}
.m-links{display:flex;justify-content:space-between;color:var(--t2)}
.m-links a{display:flex;align-items:center;gap:6px;white-space:nowrap;color:inherit;text-decoration:none;font-weight:500;font-size:14px}
.m-right{width:400px;flex:none}
.m-close{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
.m-close:hover{background:var(--o8);color:var(--t1)}
.m-name{font-weight:600;font-size:24px;line-height:30px}
.m-sub{color:var(--t2);font-size:14px;padding-bottom:14px}
.m-price{display:flex;align-items:center;gap:10px}
.m-price b{font-size:32px;font-weight:600;line-height:40px}
.m-ref{color:var(--t3);font-size:14px;padding:2px 0 16px}
.m-add{width:100%;height:48px;border-radius:6px;background:var(--purple);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.m-add.incart{background:var(--green-bg);color:var(--green)}
.lbl{font-weight:600;font-size:13px;padding:16px 0 8px}
.seller{display:flex;align-items:center;gap:10px}
.seller .avatar{width:32px;height:32px}
.seller b{font-weight:600;font-size:15px}
.seller span{color:var(--t2);font-size:14px}
.seller .ic{margin-left:auto;color:var(--t3)}
.actionbar{display:flex;gap:8px;margin-top:14px}
.actionbar button{flex:1;height:32px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;background:var(--elevated);color:var(--t2);font-weight:500;font-size:13px}
.actionbar button:hover{background:#4A4757;color:var(--t1)}
.actionbar button.on{color:var(--magenta)}
.rating{display:flex;align-items:center;gap:14px}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px;fill:var(--o16)}
.stars svg.on{fill:var(--orange)}
.rating b{display:block;font-weight:600;font-size:15px}
.rating span{color:var(--t3);font-size:13px}
.desc{color:var(--t2);font-size:14px}
.msec{display:flex;flex-direction:column}
.mhead{width:100%;display:flex;align-items:center;justify-content:space-between;height:40px;font-weight:600;font-size:13px}
.mhead .ic{width:14px;height:14px;color:var(--t2)}
.msbody{display:none;flex-direction:column;padding-bottom:6px}
.msec.open .msbody{display:flex}
.windicator{position:relative;height:22px;margin:8px 0 10px}
.windicator .scale{position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--w-fn) 0 7%,var(--w-mw) 7% 15%,var(--w-ft) 15% 38%,var(--w-ww) 38% 45%,var(--w-bs) 45% 100%)}
.windicator i{position:absolute;top:0;width:9px;height:13px;border-radius:4px;background:#fff;box-shadow:0 0 0 1.5px var(--page)}
.spec{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:15px}
.spec span{color:var(--t2)}
.spec b{font-weight:500}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--surface);border:1px solid var(--o16);
  border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ic{color:var(--green)}

/* ---------- mobile ---------- */
.mhdr,.msheet,.mfilterbar{display:none}
@media (max-width:760px){
  .hdr{display:none}
  /* Header / Mobile - Figma 232:8090 */
  .mhdr{display:flex;align-items:center;justify-content:space-between;gap:8px;height:56px;padding:0 10px;position:sticky;top:0;z-index:60;background:var(--page)}
  .mhdr .grp{display:flex;align-items:center;gap:6px}
  .mlogo{position:relative;display:block;width:40px;height:40px;flex:none;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .mlogo svg{position:absolute;left:0;top:0;width:40px;height:40px;fill:none;stroke:#6950FF;stroke-width:1.43}
  .mlogo b{position:absolute;font-weight:800;font-size:11.43px;line-height:13px;color:#fff}
  .mlogo .c1{left:10.2px;top:7.1px}
  .mlogo .s1{left:22.1px;top:7.1px}
  .mlogo .s2{left:10.1px;top:20.7px}
  .mlogo .bars{position:absolute;left:21.6px;top:24.4px;width:8px;height:5.7px;display:flex;flex-direction:column;justify-content:space-between}
  .mlogo .bars i{display:block;width:8px;height:1.2px;background:#fff}
  .mcart{position:relative;display:flex;align-items:center;gap:4px;height:36px;padding:0 6px;border-radius:4px;background:var(--elevated);color:var(--t2);font-weight:600;font-size:12px;flex:none}
  .mcart .ic{width:16px;height:16px}
  .mcart.has{background:#22AA9A;color:#fff}
  .mcart.has .cart-count{display:grid}
  .mcart .cart-count{border:0;top:-7px;right:-7px}
  .mav{position:relative;width:32px;height:32px;flex:none}
  .mav .ava{width:32px;height:32px;border-radius:50%;background:var(--magenta);color:#fff;font-weight:600;font-size:15px;display:grid;place-items:center}
  .mav .dot{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--green)}
  /* Mobile 360 / Market - Figma 232:8132 */
  .wrap{flex-direction:column;padding:12px;gap:12px}
  .sidebar{display:none}
  .toolbar-panel{margin:12px 12px 0;background:transparent;padding:0;gap:12px}
  .main{gap:12px}
  .gridhead{margin-bottom:-4px}
  .toolbar{flex-wrap:nowrap;gap:8px}
  .search{flex:1 1 auto;height:40px;border-radius:4px;padding:0 8px 0 12px}
  .search .kbd{display:none}
  .mfilterbar{display:flex;width:44px;height:40px;border-radius:4px;background:var(--elevated);align-items:center;justify-content:center;color:var(--t2);flex:none}
  .toolbar .tbtn,.toolbar .balance,.toolbar .cartbtn,.toolbar .sort{display:none}
  .gridhead{font-size:12px;min-height:24px}
  .gridhead .sort{display:flex;height:24px;padding:0 6px 0 8px;border-radius:4px;font-size:13px;font-weight:400;margin-left:auto}
  .gridhead .sort .ic{width:16px;height:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  /* Product Card / Mobile - Figma 242:9054 */
  .card{padding:8px;border-radius:8px}
  .card .name{font-size:12px;line-height:15px}
  .card .wear{font-size:10px;line-height:13px;margin-top:2px;padding-bottom:6px}
  .shot{height:142px}
  .shot .glow{filter:blur(20px)}
  .views{top:4px;right:4px;height:20px;gap:4px;padding:0 6px 0 5px;font-size:12px}
  .views .ic{width:14px;height:14px}
  .fav{left:4px;top:4px;width:20px;height:20px}
  .fav .ic{width:12px;height:12px}
  .acts{right:4px;top:30px;bottom:auto;opacity:1}
  .fav{opacity:1}
  .act{width:20px;height:20px}
  .act .ic{width:12px;height:12px}
  .acts .act:nth-child(n+2){display:none}
  .stickers{left:4px;bottom:4px}
  .prow{gap:4px;padding-top:6px}
  .price{font-size:14px;line-height:18px}
  .badge{height:20px;font-size:11px}
  .badge.del{padding:0 6px 0 5px}
  .badge.del .dl{display:none}
  .ref{font-size:10px;line-height:13px;padding-top:1px}
  .ref .rl{display:none}
  .ref .rs{display:inline}
  .frow{gap:6px;padding-top:6px}
  .wbar{width:57px;height:4px;border-radius:3px}
  .wbar i{top:-2px;width:3px;height:8px}
  .float{font-size:11px}
  .addrow{padding-top:8px}
  .add{height:30px;font-size:12px}
  .card:hover{transform:none;box-shadow:none;background:var(--surface)}
  .card:hover .add{background:var(--elevated);color:var(--t2)}
  .card.incart .add{background:var(--green-bg);color:var(--green)}
  /* Mobile 360 / Cart - Figma 234:8562 */
  .minicart{left:10px!important;right:10px!important;width:auto!important;max-width:none;top:64px!important}
  /* Mobile 360 / Product details */
  .modal{width:auto;max-width:none;left:0;right:0;top:auto;bottom:0;transform:translateY(16px);max-height:88vh;border-radius:16px 16px 0 0;flex-direction:column;padding:12px}
  .modal.on{transform:none}
  .m-right{width:auto}
  .m-shot{min-height:200px;height:200px}
  .m-name{font-size:17px;line-height:22px}
  .m-links a{font-size:13px;gap:4px}
  .m-price b{font-size:24px;line-height:30px}
  /* Mobile 360 / Filters - Figma 257:20040 */
  .msheet{display:block;position:fixed;left:0;right:0;top:64px;bottom:0;background:var(--panel);border-radius:16px 16px 0 0;z-index:80;
    transform:translateY(100%);transition:transform .22s;display:flex;flex-direction:column}
  .msheet.on{transform:none}
  .msheet .sh-head{display:flex;align-items:center;padding:14px 16px;font-weight:600;font-size:17px;border-bottom:1px solid var(--border)}
  .msheet .sh-head button{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t2)}
  .msheet .sh-body{flex:1;overflow:auto}
  .msheet .ffoot{border-top:1px solid var(--border);box-shadow:0 -6px 16px rgba(0,0,0,.4)}
  .msheet .ffoot .btn{height:44px;font-size:14px}
  .msheet .ffoot .btn.show{flex:2;background:var(--purple);color:#fff}
}
</style>
</head>

function mountFilters(root,withFoot){
 root.innerHTML=filtersHTML();
 if(!withFoot){const f=root.querySelector('.ffoot');if(f)f.remove();}
 root.querySelectorAll(".fhead").forEach(h=>h.onclick=()=>{const s=h.parentElement;s.classList.toggle("open");
   h.lastElementChild.innerHTML=s.classList.contains("open")?'<path d="M5 12h14"/>':'<path d="M12 5v14M5 12h14"/>';});
 root.querySelectorAll("[data-wear]").forEach(b=>b.onclick=()=>{const v=b.dataset.wear;
   state.wear.has(v)?state.wear.delete(v):state.wear.add(v);sync();});
 root.querySelectorAll("[data-special]").forEach(b=>b.onclick=()=>{const v=b.dataset.special;
   state.special.has(v)?state.special.delete(v):state.special.add(v);sync();});
 root.querySelectorAll("[data-rar]").forEach(b=>b.onclick=()=>{const v=b.dataset.rar;
   state.rar.has(v)?state.rar.delete(v):state.rar.add(v);sync();});
 root.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{const v=b.dataset.color;
   state.colors.has(v)?state.colors.delete(v):state.colors.add(v);sync();});
 root.querySelector("[data-min]").oninput=e=>{state.min=parseFloat(e.target.value)||null;render()};
 root.querySelector("[data-max]").oninput=e=>{state.max=parseFloat(e.target.value)||null;render()};
 const rs=root.querySelector("[data-reset]"); if(rs) rs.onclick=()=>{state.wear.clear();state.special.clear();state.rar.clear();state.colors.clear();
   state.min=state.max=null;state.cat="All";state.favOnly=false;
   document.querySelectorAll("[data-min],[data-max]").forEach(i=>i.value="");sync();toast("Filters reset")};
}
function sync(){
 document.querySelectorAll("[data-wear]").forEach(b=>b.classList.toggle("on",state.wear.has(b.dataset.wear)));
 document.querySelectorAll("[data-special]").forEach(b=>b.classList.toggle("on",state.special.has(b.dataset.special)));
 document.querySelectorAll("[data-rar]").forEach(b=>b.classList.toggle("on",state.rar.has(b.dataset.rar)));
 document.querySelectorAll("[data-color]").forEach(b=>b.classList.toggle("on",state.colors.has(b.dataset.color)));
 document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("on",b.dataset.cat===state.cat));
 document.getElementById("favBtn").classList.toggle("on",state.favOnly);

}

function cardHTML(i){

 return `<article class="card${inCart?" incart":""}" data-id="${i.id}">
  <div class="name">${i.name}</div><div class="wear">${i.wear}</div>

    <div class="acts"><button class="act" data-zoom>${svg.zoom}</button><button class="act">${svg.cube}</button><button class="act">${svg.cam}</button></div>
  </div>
  <div class="prow"><span class="price">${eur(i.price)}</span><span class="badge disc">-${i.disc}%</span>
    <span class="badge del">${svg.zap}<span class="dl">${i.del}</span></span></div>
  <div class="ref"><span class="rl">Reference price</span><span class="rs">Ref.</span> ${eur(ref(i))}</div>
  <div class="frow"><span class="wbar"><i style="left:${Math.min(96,i.float*100)}%"></i></span><span class="float">${i.float.toFixed(4)}</span></div>
  <div class="addrow"><button class="add" data-add>${inCart?svg.check+"In cart":svg.cart}</button></div>
 </article>`;
}
function visible(){
 let list=ITEMS.filter(i=>{
  if(state.cat!=="All"&&i.cat!==state.cat)return false;
  if(state.favOnly&&!state.fav.has(i.id))return false;
  if(state.q&&!i.name.toLowerCase().includes(state.q.toLowerCase()))return false;
  if(state.wear.size&&!state.wear.has(i.wear))return false;
  if(state.rar.size&&!state.rar.has(i.rar))return false;
  if(state.special.size&&![...state.special].every(s=>i.special.includes(s)))return false;
  if(state.min!=null&&i.price<state.min)return false;
  if(state.max!=null&&i.price>state.max)return false;
  return true;});
 const s=state.sort;
 if(s==="lo")list=[...list].sort((a,b)=>a.price-b.price);
 if(s==="hi")list=[...list].sort((a,b)=>b.price-a.price);
 if(s==="disc")list=[...list].sort((a,b)=>b.disc-a.disc);
 if(s==="float")list=[...list].sort((a,b)=>a.float-b.float);
 return list;
}
function render(){
 const list=visible();
 document.getElementById("grid").innerHTML=list.map(cardHTML).join("")||
  `<div style="grid-column:1/-1;padding:48px;text-align:center;color:var(--t3)">No items match these filters</div>`;
 document.getElementById("count").textContent=list.length+(list.length===1?" item":" items");
 const bits=[];
 if(state.cat!=="All")bits.push(state.cat);
 if(state.favOnly)bits.push("Favourites");
 if(state.wear.size)bits.push([...state.wear].length+" wear");
 if(state.rar.size)bits.push([...state.rar].length+" rarity");
 document.getElementById("activeFilters").textContent=bits.join(" · ");
 document.querySelectorAll(".card").forEach(c=>{
  const id=+c.dataset.id,item=ITEMS.find(x=>x.id===id);
  c.querySelector("[data-add]").onclick=e=>{e.stopPropagation();toggleCart(item)};
  c.querySelector("[data-fav]").onclick=e=>{e.stopPropagation();toggleFav(item)};
  c.querySelector("[data-zoom]").onclick=e=>{e.stopPropagation();openItem(item)};
  c.onclick=()=>openItem(item);
 });
 updateCart();
}

/* ---------- cart ---------- */
function toggleCart(i){
 if(state.cart.has(i.id)){state.cart.delete(i.id);toast("Removed from cart")}
 else{state.cart.set(i.id,1);toast("Added to cart",true)}
 render();if(document.getElementById("modal").classList.contains("on"))openItem(state.open,true);
}
function toggleFav(i){
 if(state.fav.has(i.id)){state.fav.delete(i.id);toast("Removed from favourites")}
 else{state.fav.add(i.id);toast("Added to favourites",true)}
 render();if(document.getElementById("modal").classList.contains("on"))openItem(state.open,true);
}
function cartTotal(){let t=0;state.cart.forEach((q,id)=>{t+=ITEMS.find(i=>i.id===id).price*q});return t}
function updateCart(){
 const n=state.cart.size,tot=cartTotal();
 ["cartBtn","mCart"].forEach(id=>document.getElementById(id).classList.toggle("has",n>0));
 document.getElementById("cartTotal").textContent=eur(tot);
 document.getElementById("mCartTotal").textContent=eur(tot);
 document.getElementById("cartCount").textContent=n;
 document.getElementById("mCartCount").textContent=n;
 document.getElementById("mcCount").textContent=n+(n===1?" item in cart":" items in cart");
 const box=document.getElementById("mcItems");
 if(!n){box.innerHTML=`<div class="empty">Your cart is empty</div>`;document.getElementById("mcFoot").innerHTML="";return}
 box.innerHTML=[...state.cart.keys()].map(id=>{const i=ITEMS.find(x=>x.id===id);
  return `<div class="mc-item"><div class="mc-thumb"><div class="glow" style="background:${RAR[i.rar]}"></div><img src="${IMG[i.img]}"></div>
   <div class="mc-info"><b>${i.name}</b><span>${i.wear} / ${i.float.toFixed(4)}</span></div>
   <div class="mc-right">${eur(i.price)}<div class="badge disc" style="margin-top:4px">-${i.disc}%</div></div>
   <button class="mc-del" data-del="${i.id}">${svg.trash}</button></div>`}).join("");
 document.getElementById("mcFoot").innerHTML=`
  <div class="mc-total"><span>Total</span><b>${eur(tot)}</b></div>
  <div class="bal-row"><span class="dot m">${svg.wallet}</span>Market balance<b>- € 248.10</b></div>
  <button class="split buy" id="buyBtn"><span>Buy</span><span>${eur(Math.max(0,tot-248.10))}</span></button>
  <button class="split top"><span>Top up balance</span><span>+ € 0</span></button>
  <button class="clear" id="clearCart">Clear cart</button>`;
 box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.cart.delete(+b.dataset.del);render();toast("Removed from cart")});
 document.getElementById("clearCart").onclick=()=>{state.cart.clear();render();toast("Cart cleared")};
 document.getElementById("buyBtn").onclick=()=>{toast("Purchase confirmed",true);state.cart.clear();render();closeAll()};
}
